# cargo-deny configuration: every dependency's licence must allow
# distributing Interlaken under the MIT licence. Run with
# `cargo deny check licenses`; CI runs it on every pull request.

[graph]
# Optional features (`cluster`, `smt-prover`, `object-store`) bring their own dependencies.
all-features = true

[licenses]
# Permissive licences only: no copyleft, which would constrain the whole.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Mozilla's root certificates, which the object store's HTTPS client
# (`object-store` feature) uses to verify servers: a permissive data
# licence, allowed for this crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]
