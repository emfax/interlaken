# Checks every pull request to main: formatting, clippy, the API docs,
# dependency licences (deny.toml), the test suite (which also checks the
# book's examples and generated reference sections), the object store tests
# against an S3 emulator, and the book build.
#
# The slow tests and durability checks run nightly instead (nightly.yml).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run for its previous push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.3"

jobs:
  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features interlaken-engine/cluster,interlaken-engine/object-store,interlaken-telemetry/otlp -- -D warnings
      - name: API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features interlaken-engine/cluster,interlaken-engine/object-store,interlaken-telemetry/otlp

  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release mode keeps the property, model and differential tests fast.
      - name: Test
        run: cargo test --workspace --release
      # Engines as cluster members, behind the `cluster` feature (ADR-0037).
      - name: Engine cluster tests
        run: cargo test --release -p interlaken-engine --features cluster --test cluster
      - name: Telemetry exporters
        run: cargo test --release -p interlaken-telemetry --all-features
      # The storage suite again on the commit log path (ADR-0037).
      - name: Storage tests on the commit log
        env:
          INTERLAKEN_COMMIT_LOG: "1"
        run: cargo test --release -p interlaken-storage

  object-stores:
    name: Object stores (S3 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # moto, an S3 emulator, so the S3 client path is tested on every pull
    # request (ADR-0044 phase 3); it accepts any credentials.
    services:
      s3:
        image: motoserver/moto:latest
        ports:
          - 9000:5000
    env:
      INTERLAKEN_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      INTERLAKEN_TEST_S3_BUCKET: interlaken-test
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create the bucket
        run: curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -X PUT "$INTERLAKEN_TEST_S3_ENDPOINT/$INTERLAKEN_TEST_S3_BUCKET"
      - name: Object store tests
        run: scripts/s3-test.sh

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every dependency's licence must allow distributing under MIT (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  msrv:
    name: Build on Rust 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --features interlaken-engine/cluster,interlaken-engine/object-store,interlaken-telemetry/otlp

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build docs/book
