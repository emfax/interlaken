# Nightly: the full test suite, the slow tests and the durability checks,
# on main, only when main has new commits since the last night.
#
# Run it by hand from the Actions tab (workflow_dispatch) to skip the check.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: check
        # The newest commit on main is the one to compare: a PR merged on
        # GitHub gets the merge time as its committer date. The window is 25
        # hours rather than 24 so that scheduling delays (often several
        # minutes) can't open a gap between two nights; an occasional extra
        # run is cheaper than a missed commit.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          committed=$(git log -1 --format=%ct)
          age=$(( $(date +%s) - committed ))
          echo "Newest commit on main: $(git log -1 --format='%h %ci %s') (${age}s ago)"
          if [ "$age" -lt $(( 25 * 3600 )) ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits; skipping."
          fi

  tests:
    name: Test suite and slow tests
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test suite
        run: cargo test --workspace --release
      # Every crate again with commits through the log (ADR-0037).
      - name: Test suite on the commit log
        env:
          INTERLAKEN_COMMIT_LOG: "1"
        run: cargo test --workspace --release
      # Replicated clusters under simulated faults, many seeds (ADR-0037).
      - name: Replication simulations
        env:
          SIM_SEEDS: "50"
        run: cargo test --release -p interlaken-replication --test simulation
      - name: Fetch cvc5 for the SMT prover tests
        run: |
          mkdir -p target/cvc5-download
          curl -fsSL -o target/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
          unzip -q -o target/cvc5.zip -d target/cvc5-download
          echo "CVC5=$PWD/target/cvc5-download/cvc5-Linux-x86_64-static/bin/cvc5" >> "$GITHUB_ENV"
      - name: SMT prover tests
        run: cargo test --release -p interlaken-engine --features smt-prover --test smt_prover
      - name: Ten million rows through the executor
        run: cargo test --release -p interlaken-exec --test ten_million -- --ignored --nocapture
      - name: Streaming memory through a session
        run: cargo test --release -p interlaken-engine --test streaming_memory -- --ignored --nocapture

  power-loss:
    name: Power loss (LazyFS)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LAZYFS_ROOT: ${{ github.workspace }}/../lazyfs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev cmake g++ pkg-config
          ls -l /dev/fuse
      - name: Cache LazyFS
        uses: actions/cache@v4
        with:
          path: ${{ env.LAZYFS_ROOT }}
          key: lazyfs-${{ runner.os }}-${{ hashFiles('scripts/build-lazyfs.sh') }}
      - name: Power-loss tests
        run: scripts/power-loss.sh
      - name: Power-loss tests on the commit log
        env:
          INTERLAKEN_COMMIT_LOG: "1"
        run: scripts/power-loss.sh

  disk-space:
    name: Disk-space soak
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Disk-space soak
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/disk-space-soak.sh
