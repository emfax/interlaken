[package]
name = "interlaken-engine"
description = "Ties the IR to storage: transactional authorization data and, later, query execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
interlaken-ir.workspace = true
interlaken-storage.workspace = true
thiserror.workspace = true
cedar-policy = { workspace = true, optional = true }
cedar-policy-symcc = { workspace = true, optional = true }
tokio = { version = "1", features = ["process"], optional = true }

[features]
# Prover nodes: prove policy changes with cvc5 (ADR-0030). Never needed by embedded builds.
smt-prover = ["dep:cedar-policy", "dep:cedar-policy-symcc", "dep:tokio"]

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
