[workspace]
resolver = "3"
members = ["crates/ir", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
interlaken-ir = { path = "crates/ir" }
interlaken-storage = { path = "crates/storage" }
fjall = { version = "3.1", features = ["bytes_1"] }
bytes = "1"
flume = { version = "0.12", default-features = false, features = ["async"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
