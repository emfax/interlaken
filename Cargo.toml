[workspace]
resolver = "3"
members = ["crates/engine", "crates/exec", "crates/ir", "crates/storage", "crates/test-alloc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
interlaken-exec = { path = "crates/exec" }
interlaken-ir = { path = "crates/ir" }
interlaken-storage = { path = "crates/storage" }
interlaken-test-alloc = { path = "crates/test-alloc" }
fjall = { version = "3.1", features = ["bytes_1"] }
bytes = "1"
flume = { version = "0.12", default-features = false, features = ["async"] }
thiserror = "2"
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
futures = "0.3"
# Pinned exactly: type-aware partial evaluation (tpe) is experimental (ADR-0020).
cedar-policy = { version = "=4.15.0", default-features = false, features = ["tpe"] }
smol_str = "0.3"
# The SMT prover (ADR-0030); pinned to the cedar-policy version it is built against.
cedar-policy-symcc = "=0.9.0"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
